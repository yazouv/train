name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Un push sur master qui vient d'un merge de PR a déjà été vérifié et compilé
  # dans la PR : on ne relance rien. Les push directs sur master restent vérifiés.
  gate:
    name: Déjà vérifié en PR ?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # En cas d'erreur d'API, on vérifie quand même (merged=0).
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                     --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null) || merged=0
          [[ "$merged" =~ ^[0-9]+$ ]] || merged=0
          if [ "$merged" -gt 0 ]; then
            echo "Commit issu d'une PR mergée : checks et builds déjà faits dans la PR, on saute."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Push direct sur master : on vérifie."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    uses: ./.github/workflows/build.yml
